[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-astuce"
version = "0.1.0"
description = "Bibliothèque Python pour l'API du réseau Astuce (Rouen Métropole)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-2-Clause" }
keywords = ["astuce", "rouen", "transport", "gtfs", "api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]

# Aucune dépendance externe — stdlib Python uniquement
dependencies = []

[project.optional-dependencies]
dev    = ["pytest>=7", "pytest-cov"]
webapp = ["flask>=3.0", "waitress>=3.0"]

[tool.setuptools.packages.find]
where   = ["."]
include = ["astuce*"]

# --- Configuration uv ---
[tool.uv]
# Environnement virtuel local au projet (.venv/)
# Installer la lib en mode éditable + les extras webapp :
#   uv sync --extra webapp
